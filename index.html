function isClosed(ring){
  if(!Array.isArray(ring) || ring.length &lt; 4) return false;
  const a = ring[0], b = ring[ring.length-1];
  return Math.abs(a[0]-b[0]) &lt; 1e-6 &amp;&amp; Math.abs(a[1]-b[1]) &lt; 1e-6;

function closeRing(ring){
  if(!ring || ring.length &lt; 3) return null;
  const out = ring.map(p =&gt; [Number(p[0]), Number(p[1])]).filter(p =&gt; isFinite(p[0]) &amp;&amp; isFinite(p[1]));

  const a = out[0], b = out[out.length-1];
  if(Math.abs(a[0]-b[0]) &gt; 1e-6 || Math.abs(a[1]-b[1]) &gt; 1e-6) out.push([a[0], a[1]]);

  let sum = 0;

  if(geom.type === &#x27;MultiLineString&#x27;) rings = geom.coordinates || [];

    const resetBtn = document.getElementById(&#x27;resetBtn&#x27;);
    const message = document.getElementById(&#x27;message&#x27;);
    const preview = document.getElementById(&#x27;preview&#x27;);
    const previewTable = document.getElementById(&#x27;previewTable&#x27;);
    const summary = document.getElementById(&#x27;summary&#x27;);

    let sourceRows = [];
    let headers = [];
    let convertedRows = [];
    let convertedHeaders = [];

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    function clearMessage() {
      message.textContent = &#x27;&#x27;;
      message.className = &#x27;message&#x27;;
    }

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = &#x27;&#x27;;
      let inQuotes = false;

      for (let i = 0; i &lt; text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === &#x27;&quot;&#x27; &amp;&amp; inQuotes &amp;&amp; next === &#x27;&quot;&#x27;) {
          field += &#x27;&quot;&#x27;;
          i++;
        } else if (char === &#x27;&quot;&#x27;) {
          inQuotes = !inQuotes;
        } else if (char === &#x27;,&#x27; &amp;&amp; !inQuotes) {
          row.push(field);
          field = &#x27;&#x27;;
        } else if ((char === &#x27;\n&#x27; || char === &#x27;\r&#x27;) &amp;&amp; !inQuotes) {
          if (char === &#x27;\r&#x27; &amp;&amp; next === &#x27;\n&#x27;) i++;
          row.push(field);
          if (row.some(value =&gt; value !== &#x27;&#x27;)) rows.push(row);
          row = [];
          field = &#x27;&#x27;;
        } else {
          field += char;
        }
      }

      row.push(field);
      if (row.some(value =&gt; value !== &#x27;&#x27;)) rows.push(row);
      return rows;
    }

    function escapeCSV(value) {
      const text = value == null ? &#x27;&#x27; : String(value);
      if (/[&quot;,\n\r]/.test(text)) return `&quot;${text.replace(/&quot;/g, &#x27;&quot;&quot;&#x27;)}&quot;`;
      return text;
    }

    function findSuggestedColumn() {
      const preferred = headers.findIndex(h =&gt; /^wkt$/i.test(h.trim()));
      if (preferred &gt;= 0) return preferred;

      for (let c = 0; c &lt; headers.length; c++) {
        const hasPoint = sourceRows.slice(0, 30).some(row =&gt; /POINT\s*\(/i.test(row[c] || &#x27;&#x27;));
        if (hasPoint) return c;
      }
      return 0;
    }

    function populateColumnSelect() {
      wktColumn.innerHTML = &#x27;&#x27;;
      headers.forEach((header, index) =&gt; {
        const option = document.createElement(&#x27;option&#x27;);
        option.value = index;
        option.textContent = header || `Column ${index + 1}`;
        wktColumn.appendChild(option);
      });
      wktColumn.value = findSuggestedColumn();
      wktColumn.disabled = false;
    }

    function loadFile(file) {
      clearMessage();
      if (!file || !file.name.toLowerCase().endsWith(&#x27;.csv&#x27;)) {
        showMessage(&#x27;Please choose a CSV file.&#x27;, &#x27;error&#x27;);
        return;
      }

      const reader = new FileReader();
      reader.onload = event =&gt; {
        try {
          const parsed = parseCSV(event.target.result.replace(/^\uFEFF/, &#x27;&#x27;));
          if (parsed.length &lt; 2) throw new Error(&#x27;The CSV does not contain any data rows.&#x27;);

          headers = parsed[0];
          sourceRows = parsed.slice(1).map(row =&gt; {
            const copy = [...row];
            while (copy.length &lt; headers.length) copy.push(&#x27;&#x27;);
            return copy;
          });

          populateColumnSelect();
          fileLabel.textContent = file.name;
          outputName.value = file.name.replace(/\.csv$/i, &#x27;&#x27;) + &#x27;_cleaned.csv&#x27;;
          convertBtn.disabled = false;
          downloadBtn.disabled = true;
          preview.style.display = &#x27;none&#x27;;
          showMessage(`Loaded ${sourceRows.length.toLocaleString()} rows. Choose the WKT column, then convert.`, &#x27;success&#x27;);
        } catch (error) {
          showMessage(error.message || &#x27;The file could not be read.&#x27;, &#x27;error&#x27;);
        }
      };
      reader.readAsText(file);
    }

    function parsePoint(value) {
      const match = String(value || &#x27;&#x27;).trim().match(/^POINT(?:\s+Z|\s+M|\s+ZM)?\s*\(\s*([-+]?\d*\.?\d+(?:[eE][-+]?\d+)?)\s+([-+]?\d*\.?\d+(?:[eE][-+]?\d+)?)(?:\s+[-+]?\d*\.?\d+(?:[eE][-+]?\d+)?)?\s*\)$/i);
      if (!match) return null;
      return { longitude: Number(match[1]), latitude: Number(match[2]) };
    }

    function convert() {
      clearMessage();
      const columnIndex = Number(wktColumn.value);
      let valid = 0;
      let invalid = 0;

      const baseHeaders = headers.filter((_, index) =&gt; !(removeWkt.checked &amp;&amp; index === columnIndex));
      convertedHeaders = latFirst.checked
        ? [&#x27;latitude&#x27;, &#x27;longitude&#x27;, ...baseHeaders]
        : [...baseHeaders, &#x27;latitude&#x27;, &#x27;longitude&#x27;];

      convertedRows = sourceRows.map(row =&gt; {
        const point = parsePoint(row[columnIndex]);
        if (point) valid++; else invalid++;

        const baseRow = row.filter((_, index) =&gt; !(removeWkt.checked &amp;&amp; index === columnIndex));
        const latitude = point ? point.latitude : &#x27;&#x27;;
        const longitude = point ? point.longitude : &#x27;&#x27;;

        return latFirst.checked
          ? [latitude, longitude, ...baseRow]
          : [...baseRow, latitude, longitude];
      });

      renderPreview();
      downloadBtn.disabled = false;
      preview.style.display = &#x27;block&#x27;;

      if (invalid === 0) {
        showMessage(`Converted all ${valid.toLocaleString()} rows successfully.`, &#x27;success&#x27;);
      } else {
        showMessage(`Converted ${valid.toLocaleString()} rows. ${invalid.toLocaleString()} rows did not contain a valid WKT POINT and were left blank.`, &#x27;error&#x27;);
      }
    }

    function renderPreview() {
      const maxRows = 100;
      previewTable.innerHTML = &#x27;&#x27;;

      const thead = document.createElement(&#x27;thead&#x27;);
      const headerRow = document.createElement(&#x27;tr&#x27;);
      convertedHeaders.forEach(header =&gt; {
        const th = document.createElement(&#x27;th&#x27;);
        th.textContent = header;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);
      previewTable.appendChild(thead);

      const tbody = document.createElement(&#x27;tbody&#x27;);
      convertedRows.slice(0, maxRows).forEach(row =&gt; {
        const tr = document.createElement(&#x27;tr&#x27;);
        row.forEach(value =&gt; {
          const td = document.createElement(&#x27;td&#x27;);
          td.textContent = value;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      previewTable.appendChild(tbody);

      summary.textContent = convertedRows.length &gt; maxRows
        ? `Showing first ${maxRows} of ${convertedRows.length.toLocaleString()} rows`
        : `${convertedRows.length.toLocaleString()} rows`;
    }

    function downloadCSV() {
      const lines = [convertedHeaders, ...convertedRows]
        .map(row =&gt; row.map(escapeCSV).join(&#x27;,&#x27;))
        .join(&#x27;\r\n&#x27;);

      const blob = new Blob([&#x27;\uFEFF&#x27; + lines], { type: &#x27;text/csv;charset=utf-8&#x27; });
      const url = URL.createObjectURL(blob);
      const link = document.createElement(&#x27;a&#x27;);
      link.href = url;
      link.download = outputName.value.trim() || &#x27;cleaned_map.csv&#x27;;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function reset() {
      fileInput.value = &#x27;&#x27;;
      fileLabel.textContent = &#x27;Choose a CSV file&#x27;;
      wktColumn.innerHTML = &#x27;&lt;option&gt;Upload a file first&lt;/option&gt;&#x27;;
      wktColumn.disabled = true;
      outputName.value = &#x27;cleaned_map.csv&#x27;;
      removeWkt.checked = false;
      latFirst.checked = true;
      convertBtn.disabled = true;
      downloadBtn.disabled = true;
      preview.style.display = &#x27;none&#x27;;
      previewTable.innerHTML = &#x27;&#x27;;
      clearMessage();
      sourceRows = [];
      headers = [];
      convertedRows = [];
      convertedHeaders = [];
    }

    fileInput.addEventListener(&#x27;change&#x27;, event =&gt; loadFile(event.target.files[0]));
    convertBtn.addEventListener(&#x27;click&#x27;, convert);
    downloadBtn.addEventListener(&#x27;click&#x27;, downloadCSV);
    resetBtn.addEventListener(&#x27;click&#x27;, reset);

    [&#x27;dragenter&#x27;, &#x27;dragover&#x27;].forEach(eventName =&gt; {
      dropzone.addEventListener(eventName, event =&gt; {
        event.preventDefault();
        dropzone.classList.add(&#x27;dragover&#x27;);
      });
    });

    [&#x27;dragleave&#x27;, &#x27;drop&#x27;].forEach(eventName =&gt; {
      dropzone.addEventListener(eventName, event =&gt; {
        event.preventDefault();
        dropzone.classList.remove(&#x27;dragover&#x27;);
      });
    });

    dropzone.addEventListener(&#x27;drop&#x27;, event =&gt; {
      const file = event.dataTransfer.files[0];
      loadFile(file);
    });
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
'></iframe>
<script>
function show(i,b){
document.querySelectorAll('iframe').forEach((f,n)=>f.classList.toggle('active',n===i));
document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
b.classList.add('active');
}
</script>
